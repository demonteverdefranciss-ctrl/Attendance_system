<svg xmlns="http://www.w3.org/2000/svg" width="720" height="320" viewBox="0 0 720 320" role="img" aria-labelledby="title description">
  <title id="title">Example of a suitable face photo</title>
  <desc id="description">A clear, front-facing head-and-shoulders portrait with a plain background is recommended. Avoid distant, blurry, or full-body photos.</desc>
